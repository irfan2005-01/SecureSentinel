<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3be65" />
      <stop offset="100%" stop-color="#d4a24c" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8cd7a5" />
      <stop offset="100%" stop-color="#005731" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Angular Sentinel Crest -->
  <polygon points="50,8 88,25 88,62 50,92 12,62 12,25" fill="#161c23" stroke="url(#shieldGrad)" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Inner Facets -->
  <polygon points="50,16 80,31 80,57 50,82 20,57 20,31" fill="#0e141b" stroke="#4f4537" stroke-width="1.5" />
  
  <!-- Cryptographic Sentinel Core -->
  <polygon points="50,28 68,39 68,61 50,72 32,61 32,39" fill="url(#shieldGrad)" />
  <polygon points="50,33 63,42 63,58 50,67 37,58 37,42" fill="#090f15" />
  
  <!-- Central Pulse Node & Crosshair Pins -->
  <circle cx="50" cy="50" r="5" fill="#8cd7a5" filter="url(#glow)" />
  <path d="M50,43 L50,36 M50,57 L50,64 M43,50 L36,50 M57,50 L64,50" stroke="#f3be65" stroke-width="2" stroke-linecap="round" />
</svg>
